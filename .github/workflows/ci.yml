name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read # gitleaks lists a PR's commits through the API

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit in the push/PR

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Type check Vite config
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc -b tsconfig.node.json

      - name: Tests with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run coverage -- --coverage.reporter=text --coverage.reporter=json-summary

      - name: Coverage gate (lines >= 90%)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node -e '
            const pct = require("./coverage/coverage-summary.json").total.lines.pct;
            console.log(`Line coverage: ${pct}%`);
            if (pct < 90) { console.error("Line coverage is below 90%"); process.exit(1); }
          '

      - name: Secret scan
        if: ${{ !cancelled() }} # doesn't need npm install
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high
